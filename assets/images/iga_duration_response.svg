<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="chartTitle chartDesc">
  <title id="chartTitle">Month-9 proteinuria reduction by IgA nephropathy disease duration</title>
  <desc id="chartDesc">Exploratory comparison in 31 patients. Disease duration of 24 months or less: 14 patients, median proteinuria reduction 76.33 percent, interquartile range 52.73 to 85.81 percent. Disease duration greater than 24 months: 17 patients, median reduction 43.64 percent, interquartile range 15.09 to 78.57 percent. Unadjusted P equals 0.012. Interquartile ranges are shown as thick horizontal intervals and medians as circles.</desc>
  <rect width="1100" height="600" fill="#fff"/>
  <path d="M62 38 H200" stroke="#0c234b" stroke-width="6"/>
  <path d="M200 38 H232" stroke="#ab0520" stroke-width="6"/>
  <text x="62" y="82" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2.2" fill="#0c234b">EXPLORATORY CLINICAL SUBGROUP</text>
  <text x="62" y="138" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="650" fill="#152c41">Proteinuria reduction at month 9</text>
  <text x="63" y="174" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#65788a">Disease duration at treatment initiation · median and interquartile range</text>

  <g stroke="#e0e8ed" stroke-width="2">
    <path d="M330 216 V455"/><path d="M474 216 V455"/><path d="M618 216 V455"/><path d="M762 216 V455"/><path d="M906 216 V455"/>
  </g>
  <g fill="#82909a" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
    <text x="330" y="481">0%</text><text x="474" y="481">20%</text><text x="618" y="481">40%</text><text x="762" y="481">60%</text><text x="906" y="481">80%</text>
    <text x="1050" y="481">100%</text>
  </g>
  <path d="M1050 216 V455" stroke="#e0e8ed" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="282" font-size="26" font-weight="650" fill="#152c41">≤ 24 months</text>
    <text x="62" y="310" font-size="19" fill="#81909c">n = 14</text>
    <text x="62" y="396" font-size="26" font-weight="650" fill="#152c41">&gt; 24 months</text>
    <text x="62" y="424" font-size="19" fill="#81909c">n = 17</text>
  </g>

  <path d="M709.66 286 H947.82" stroke="#ab0520" stroke-width="24" stroke-linecap="round" opacity="0.18"/>
  <path d="M709.66 286 H947.82" stroke="#ab0520" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="879.58" cy="286" r="15" fill="#ab0520" stroke="#fff" stroke-width="4"/>
  <text x="1044" y="294" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ab0520">76.3%</text>

  <path d="M438.65 401 H895.70" stroke="#0c234b" stroke-width="24" stroke-linecap="round" opacity="0.16"/>
  <path d="M438.65 401 H895.70" stroke="#0c234b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="644.21" cy="401" r="15" fill="#0c234b" stroke="#fff" stroke-width="4"/>
  <text x="1044" y="409" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0c234b">43.6%</text>

  <path d="M62 511 H1038" stroke="#e2e7eb" stroke-width="2"/>
  <circle cx="77" cy="544" r="7" fill="#0c234b"/>
  <text x="96" y="551" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5d6e7b">Dot: median · line: IQR</text>
  <text x="1038" y="551" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5d6e7b">Unadjusted P = 0.012 · hypothesis-generating only</text>
</svg>
